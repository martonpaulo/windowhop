name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      description: WindowHop deliberately excludes some features (see CONTRIBUTING.md).
      options:
        - label: This is not previews/thumbnails, search, tiling, app launching, themes, or telemetry
          required: true
