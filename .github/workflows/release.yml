name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  SPARKLE_VERSION: 2.9.4
  SPARKLE_SHA256: ce89daf967db1e1893ed3ebd67575ed82d3902563e3191ca92aaec9164fbdef9

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Tests and validation
        run: |
          swift test
          scripts/validate.sh

      - name: Derive version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          BUILD=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      - name: Enforce release source and version
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "Official release tags must point at the current main commit." >&2
            exit 1
          }
          PLIST_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Support/Info.plist)
          PLIST_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" Support/Info.plist)
          test "$PLIST_VERSION" = "${{ steps.version.outputs.version }}" || {
            echo "Tag version does not match Support/Info.plist." >&2
            exit 1
          }
          test "$PLIST_BUILD" = "${{ steps.version.outputs.build }}" || {
            echo "Derived build number does not match Support/Info.plist." >&2
            exit 1
          }

      - name: Require official release credentials
        env:
          CERT: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          missing=()
          [ -n "$CERT" ] || missing+=(DEVELOPER_ID_CERT_P12)
          [ -n "$CERT_PASSWORD" ] || missing+=(DEVELOPER_ID_CERT_PASSWORD)
          [ -n "$NOTARY_APPLE_ID" ] || missing+=(NOTARIZATION_APPLE_ID)
          [ -n "$NOTARY_PASSWORD" ] || missing+=(NOTARIZATION_PASSWORD)
          [ -n "$NOTARY_TEAM_ID" ] || missing+=(NOTARIZATION_TEAM_ID)
          [ -n "$SPARKLE_KEY" ] || missing+=(SPARKLE_PRIVATE_KEY)
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "Official release blocked: missing required secrets: ${missing[*]}" >&2
            exit 1
          fi

      # A stable signing identity keeps the app's TCC (Accessibility) grant valid
      # across updates. Official releases require an Apple-issued Developer ID
      # Application certificate; ad-hoc and self-signed identities are rejected.
      - name: Import Developer ID certificate
        env:
          CERT: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          umask 077
          KEYCHAIN=build.keychain
          security create-keychain -p ci "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          echo "$CERT" | base64 --decode > cert.p12
          # OpenSSL 3 PKCS#12 encryption and non-ASCII export passwords are not
          # consistently accepted by macOS Security.framework. Validate the
          # supplied password, then normalize the bundle into the legacy
          # PKCS#12 profile that Keychain accepts. The unencrypted intermediate
          # is permission-restricted and removed by the EXIT trap on all paths.
          export CERT_PASSWORD
          COMPAT_PASSWORD=windowhop-ephemeral-ci-import
          export COMPAT_PASSWORD
          trap 'rm -f cert.p12 cert-extracted.pem cert-compatible.p12' EXIT
          openssl pkcs12 -legacy -in cert.p12 -passin env:CERT_PASSWORD \
            -nodes -out cert-extracted.pem
          openssl pkcs12 -export -legacy -in cert-extracted.pem \
            -passout env:COMPAT_PASSWORD -out cert-compatible.p12
          security import cert-compatible.p12 -k "$KEYCHAIN" \
            -P "$COMPAT_PASSWORD" -T /usr/bin/codesign
          rm -f cert.p12 cert-extracted.pem cert-compatible.p12
          trap - EXIT
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Application:/ {print $2; exit}')
          case "$IDENTITY" in
            "Developer ID Application:"*) ;;
            *) echo "Official release blocked: P12 does not contain a valid Developer ID Application identity." >&2; exit 1 ;;
          esac
          echo "DEVELOPER_ID_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "signing as: $IDENTITY"

      - name: Build and package
        run: |
          scripts/package-app.sh "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.build }}"
          scripts/verify-release-identity.sh build/WindowHop.app

      - name: Notarize, staple, and validate app
        env:
          APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          RESULT=$(xcrun notarytool submit "artifacts/WindowHop-$VERSION.zip" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait --output-format json)
          STATUS=$(jq -r '.status' <<< "$RESULT")
          SUBMISSION_ID=$(jq -r '.id' <<< "$RESULT")
          if [ "$STATUS" != "Accepted" ]; then
            echo "Apple notarization rejected the app archive (status: $STATUS, id: $SUBMISSION_ID)." >&2
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
              notarization-app-log.json || true
            exit 1
          fi
          xcrun stapler staple build/WindowHop.app
          xcrun stapler validate build/WindowHop.app
          codesign --verify --deep --strict --verbose=2 build/WindowHop.app
          spctl --assess --type execute --verbose=2 build/WindowHop.app
          rm "artifacts/WindowHop-$VERSION.zip"
          ditto -c -k --keepParent build/WindowHop.app "artifacts/WindowHop-$VERSION.zip"

      - name: Sign update for Sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          curl -sL -o sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          echo "$SPARKLE_SHA256  sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p sparkle-tools && tar -xf sparkle.tar.xz -C sparkle-tools
          SIG=$(echo "$SPARKLE_PRIVATE_KEY" | sparkle-tools/bin/sign_update --ed-key-file - "artifacts/WindowHop-$VERSION.zip")
          echo "SPARKLE_SIG_ATTRS=$SIG" >> "$GITHUB_ENV"

      - name: DMG
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          scripts/make-dmg.sh "$VERSION"

      - name: Notarize, staple, and validate DMG
        env:
          APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DMG="artifacts/WindowHop-$VERSION.dmg"
          RESULT=$(xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait --output-format json)
          STATUS=$(jq -r '.status' <<< "$RESULT")
          SUBMISSION_ID=$(jq -r '.id' <<< "$RESULT")
          if [ "$STATUS" != "Accepted" ]; then
            echo "Apple notarization rejected the DMG (status: $STATUS, id: $SUBMISSION_ID)." >&2
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
              notarization-dmg-log.json || true
            exit 1
          fi
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          codesign --verify --verbose=2 "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"
          scripts/verify-dmg-branding.sh "$DMG"
          MOUNT=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT" -quiet || true; rmdir "$MOUNT" || true' EXIT
          codesign --verify --deep --strict --verbose=2 "$MOUNT/WindowHop.app"
          scripts/verify-release-identity.sh "$MOUNT/WindowHop.app"
          spctl --assess --type execute --verbose=2 "$MOUNT/WindowHop.app"
          cmp Support/AppInstallerIcon.icns "$MOUNT/.VolumeIcon.icns" || {
            echo "Branded mounted-volume icon is missing or changed." >&2
            exit 1
          }
          test -f "$MOUNT/.DS_Store" || {
            echo "Finder installer layout is missing." >&2
            exit 1
          }
          hdiutil detach "$MOUNT" -quiet
          rmdir "$MOUNT"
          trap - EXIT
          # GitHub's raw-asset transport cannot preserve a macOS resource fork.
          # This human-download ZIP preserves the DMG's branded Finder icon;
          # the raw DMG remains attached for direct mounts and automation.
          # A single-file source already keeps its basename. --keepParent would
          # also archive the local artifacts/ directory, which is poor installer UX.
          ditto -c -k --sequesterRsrc "$DMG" \
            "artifacts/WindowHop-$VERSION-Installer.zip"
          ZIP_TEST=$(mktemp -d)
          ditto -x -k "artifacts/WindowHop-$VERSION-Installer.zip" "$ZIP_TEST"
          EXTRACTED_DMG="$ZIP_TEST/WindowHop-$VERSION.dmg"
          test -f "$EXTRACTED_DMG" || {
            echo "Installer ZIP has an unexpected directory layout." >&2
            exit 1
          }
          DeRez -only icns "$EXTRACTED_DMG" | grep -F "data 'icns'" >/dev/null || {
            echo "Installer ZIP did not preserve the DMG Finder icon resource." >&2
            exit 1
          }
          GetFileInfo -a "$EXTRACTED_DMG" | grep -q C || {
            echo "Installer ZIP did not preserve the DMG custom-icon Finder flag." >&2
            exit 1
          }
          hdiutil verify "$EXTRACTED_DMG" -quiet
          find "$ZIP_TEST" -depth -delete

      - name: Update appcast on main
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          scripts/make-appcast.sh "$VERSION" "${{ steps.version.outputs.build }}" \
            "artifacts/WindowHop-$VERSION.zip" "$SPARKLE_SIG_ATTRS"
          if ! git diff --quiet appcast.xml; then
            git add appcast.xml
            git commit -m "chore(release): appcast entry for $VERSION"
            git push origin main
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; skipping creation"
            exit 0
          fi
          # Human installer ZIP preserves the DMG Finder icon; raw DMG remains
          # available, and the plain ZIP is Sparkle's signed update archive.
          awk -v version="$VERSION" '
            $0 ~ "^## " version " " { printing=1; next }
            printing && /^## / { exit }
            printing { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "Missing CHANGELOG release notes for $VERSION" >&2; exit 1; }
          gh release create "$GITHUB_REF_NAME" \
            "artifacts/WindowHop-$VERSION-Installer.zip" \
            "artifacts/WindowHop-$VERSION.dmg" \
            "artifacts/WindowHop-$VERSION.zip" \
            --title "WindowHop $VERSION" \
            --notes-file release-notes.md
