name: Release

# A pushed vX.Y.Z tag starts a release. workflow_dispatch reruns one by hand, and only on
# such a tag: publication always happens here, never from a Mac.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  # dispatches Deploy once the release is published, so its notes page exists
  actions: write

# The same Xcode pin as validate.yml; change both together.
env:
  XCODE_VERSION: "26.6"
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  release:
    runs-on: macos-26
    # Optional: a fine-grained token with Contents read/write on martonpaulo/homebrew-tap.
    # A secret cannot appear in a step's `if:`, so it is exposed here and tested as env.
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Require a release tag
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*.*.*) ;;
            *) echo "Release runs only on a vX.Y.Z tag; dispatch it on the tag, not $GITHUB_REF." >&2
               exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Confirm the pinned Xcode
        run: |
          xcodebuild -version
          xcodebuild -version | grep -qx "Xcode $XCODE_VERSION"

      # Only SwiftPM's download cache: a signed release always compiles from a clean
      # .build, never from objects a previous run left behind.
      - name: Restore the SwiftPM download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved') }}

      - name: Tests and validation
        run: |
          swift test
          scripts/validate.sh

      - name: Derive version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          BUILD=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      - name: Enforce release source and version
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo "Official release tags must point at the current main commit." >&2
            exit 1
          }
          PLIST_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Support/Info.plist)
          PLIST_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" Support/Info.plist)
          test "$PLIST_VERSION" = "${{ steps.version.outputs.version }}" || {
            echo "Tag version does not match Support/Info.plist." >&2
            exit 1
          }
          test "$PLIST_BUILD" = "${{ steps.version.outputs.build }}" || {
            echo "Derived build number does not match Support/Info.plist." >&2
            exit 1
          }

      - name: Require official release credentials
        env:
          CERT: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          missing=()
          [ -n "$CERT" ] || missing+=(DEVELOPER_ID_CERT_P12)
          [ -n "$CERT_PASSWORD" ] || missing+=(DEVELOPER_ID_CERT_PASSWORD)
          [ -n "$NOTARY_API_KEY" ] || missing+=(NOTARY_API_KEY)
          [ -n "$NOTARY_API_KEY_ID" ] || missing+=(NOTARY_API_KEY_ID)
          [ -n "$NOTARY_API_ISSUER_ID" ] || missing+=(NOTARY_API_ISSUER_ID)
          [ -n "$SPARKLE_KEY" ] || missing+=(SPARKLE_PRIVATE_KEY)
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "Official release blocked: missing required secrets: ${missing[*]}" >&2
            exit 1
          fi

      # A stable signing identity keeps the app's TCC (Accessibility) grant valid
      # across updates. Official releases require an Apple-issued Developer ID
      # Application certificate; ad-hoc and self-signed identities are rejected.
      - name: Import Developer ID certificate
        env:
          CERT: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          umask 077
          KEYCHAIN=build.keychain
          security create-keychain -p ci "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          echo "$CERT" | base64 --decode > cert.p12
          # OpenSSL 3 PKCS#12 encryption and non-ASCII export passwords are not
          # consistently accepted by macOS Security.framework. Validate the
          # supplied password, then normalize the bundle into the legacy
          # PKCS#12 profile that Keychain accepts. The unencrypted intermediate
          # is permission-restricted and removed by the EXIT trap on all paths.
          export CERT_PASSWORD
          COMPAT_PASSWORD=windowhop-ephemeral-ci-import
          export COMPAT_PASSWORD
          trap 'rm -f cert.p12 cert-extracted.pem cert-compatible.p12' EXIT
          openssl pkcs12 -legacy -in cert.p12 -passin env:CERT_PASSWORD \
            -nodes -out cert-extracted.pem
          openssl pkcs12 -export -legacy -in cert-extracted.pem \
            -passout env:COMPAT_PASSWORD -out cert-compatible.p12
          security import cert-compatible.p12 -k "$KEYCHAIN" \
            -P "$COMPAT_PASSWORD" -T /usr/bin/codesign
          rm -f cert.p12 cert-extracted.pem cert-compatible.p12
          trap - EXIT
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Application:/ {print $2; exit}')
          case "$IDENTITY" in
            "Developer ID Application:"*) ;;
            *) echo "Official release blocked: P12 does not contain a valid Developer ID Application identity." >&2; exit 1 ;;
          esac
          echo "DEVELOPER_ID_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "signing as: $IDENTITY"

      - name: Build and package
        run: |
          # The canonical package-app.sh copies Support/Info.plist into the bundle
          # before signing, so the release date is stamped into this runner's copy
          # (never committed): the packaged commit's date, reproducible per commit.
          scripts/stamp-app-metadata.sh Support/Info.plist "${{ steps.version.outputs.version }}" \
            "${{ steps.version.outputs.build }}" "$(git log -1 --format=%cs)"
          scripts/package-app.sh --version "${{ steps.version.outputs.version }}" \
            --build-number "${{ steps.version.outputs.build }}"
          # the stamp is in the bundle now; leave the checkout clean for the appcast commit
          git checkout -- Support/Info.plist
          scripts/verify-release-identity.sh --app build/WindowHop.app

      # The team App Store Connect API key is written to a private temporary file
      # for scripts/notarize.sh and removed by the always-run step at the end.
      - name: Write notary API key
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          umask 077
          KEY_PATH="$RUNNER_TEMP/notary/AuthKey.p8"
          mkdir -p "$(dirname "$KEY_PATH")"
          printf '%s\n' "$NOTARY_API_KEY" > "$KEY_PATH"
          {
            echo "NOTARY_API_KEY_PATH=$KEY_PATH"
            echo "NOTARY_API_KEY_ID=$NOTARY_API_KEY_ID"
            echo "NOTARY_API_ISSUER_ID=$NOTARY_API_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Notarize, staple, and validate app
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          scripts/notarize.sh "artifacts/WindowHop-$VERSION.zip"
          xcrun stapler staple build/WindowHop.app
          xcrun stapler validate build/WindowHop.app
          codesign --verify --deep --strict --verbose=2 build/WindowHop.app
          spctl --assess --type execute --verbose=2 build/WindowHop.app
          rm "artifacts/WindowHop-$VERSION.zip"
          ditto -c -k --keepParent build/WindowHop.app "artifacts/WindowHop-$VERSION.zip"

      # scripts/sign-update.sh runs the sign_update of the resolved Sparkle
      # binary target that SwiftPM checksum-verified and embedded, so the tool
      # and the framework cannot come from different releases.
      - name: Sign update for Sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          RESOLVED=$(python3 -c 'import json; print(next(p["state"]["version"] for p in json.load(open("Package.resolved"))["pins"] if p["identity"] == "sparkle"))')
          EMBEDDED=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build/WindowHop.app/Contents/Frameworks/Sparkle.framework/Resources/Info.plist)
          echo "Sparkle resolved: $RESOLVED; embedded framework: $EMBEDDED"
          test "$RESOLVED" = "$EMBEDDED" || {
            echo "Embedded Sparkle ($EMBEDDED) differs from Package.resolved ($RESOLVED)." >&2
            exit 1
          }
          SIG=$(printf '%s\n' "$SPARKLE_PRIVATE_KEY" \
            | scripts/sign-update.sh --archive "artifacts/WindowHop-$VERSION.zip" -- --ed-key-file -)
          echo "SPARKLE_SIG_ATTRS=$SIG" >> "$GITHUB_ENV"

      - name: DMG
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          scripts/make-dmg.sh --version "$VERSION"

      - name: Notarize, staple, and validate DMG
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DMG="artifacts/WindowHop-$VERSION.dmg"
          scripts/notarize.sh "$DMG"
          codesign --verify --verbose=2 "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"
          scripts/verify-dmg-branding.sh --dmg "$DMG"
          MOUNT=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT" -quiet || true; rmdir "$MOUNT" || true' EXIT
          codesign --verify --deep --strict --verbose=2 "$MOUNT/WindowHop.app"
          scripts/verify-release-identity.sh --app "$MOUNT/WindowHop.app"
          spctl --assess --type execute --verbose=2 "$MOUNT/WindowHop.app"
          cmp Support/AppInstallerIcon.icns "$MOUNT/.VolumeIcon.icns" || {
            echo "Branded mounted-volume icon is missing or changed." >&2
            exit 1
          }
          test -f "$MOUNT/.DS_Store" || {
            echo "Finder installer layout is missing." >&2
            exit 1
          }
          hdiutil detach "$MOUNT" -quiet
          rmdir "$MOUNT"
          trap - EXIT
          # GitHub's raw-asset transport cannot preserve a macOS resource fork.
          # This human-download ZIP preserves the DMG's branded Finder icon;
          # the raw DMG remains attached for direct mounts and automation.
          # A single-file source already keeps its basename. --keepParent would
          # also archive the local artifacts/ directory, which is poor installer UX.
          ditto -c -k --sequesterRsrc "$DMG" \
            "artifacts/WindowHop-$VERSION-Installer.zip"
          ZIP_TEST=$(mktemp -d)
          ditto -x -k "artifacts/WindowHop-$VERSION-Installer.zip" "$ZIP_TEST"
          EXTRACTED_DMG="$ZIP_TEST/WindowHop-$VERSION.dmg"
          test -f "$EXTRACTED_DMG" || {
            echo "Installer ZIP has an unexpected directory layout." >&2
            exit 1
          }
          DeRez -only icns "$EXTRACTED_DMG" | grep -F "data 'icns'" >/dev/null || {
            echo "Installer ZIP did not preserve the DMG Finder icon resource." >&2
            exit 1
          }
          GetFileInfo -a "$EXTRACTED_DMG" | grep -q C || {
            echo "Installer ZIP did not preserve the DMG custom-icon Finder flag." >&2
            exit 1
          }
          hdiutil verify "$EXTRACTED_DMG" -quiet
          find "$ZIP_TEST" -depth -delete

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          scripts/release-notes.sh --version "$VERSION" > release-notes.md
          # Human installer ZIP preserves the DMG Finder icon; the raw DMG stays
          # available for direct mounts, and the plain ZIP is Sparkle's signed
          # update archive. Every artifact is staged in a draft and verified
          # before the release becomes public, because the appcast step below
          # may only advertise files that already exist.
          scripts/publish-release.sh --tag "$GITHUB_REF_NAME" --notes-file release-notes.md \
            --artifact "artifacts/WindowHop-$VERSION-Installer.zip" \
            --artifact "artifacts/WindowHop-$VERSION.dmg" \
            --artifact "artifacts/WindowHop-$VERSION.zip"

      # Only now, with the update ZIP verifiably downloadable, does the public
      # feed learn about it. An existing entry for this version is accepted
      # only when it matches this build exactly.
      - name: Update appcast on main
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          scripts/make-appcast.sh --version "$VERSION" \
            --build-number "${{ steps.version.outputs.build }}" \
            --archive "artifacts/WindowHop-$VERSION.zip" --signature "$SPARKLE_SIG_ATTRS"
          # make-appcast.sh (skill-deck's canonical copy) links the GitHub release
          # page; Sparkle's window shows the site's own notes page instead (#128).
          perl -pi -e "s#<sparkle:releaseNotesLink>https://github.com/martonpaulo/windowhop/releases/tag/v$VERSION</sparkle:releaseNotesLink>#<sparkle:releaseNotesLink>https://windowhop.martonpaulo.com/release-notes/$VERSION/</sparkle:releaseNotesLink>\n      <sparkle:fullReleaseNotesLink>https://windowhop.martonpaulo.com/release-notes/</sparkle:fullReleaseNotesLink>#" appcast.xml
          if ! git diff --quiet appcast.xml; then
            git add appcast.xml
            git commit -m "chore(release): appcast entry for $VERSION"
            # a concurrent appcast change must be reconciled, never discarded
            git pull --rebase origin main
            git push origin main
          fi

      # Keeps the Homebrew cask (martonpaulo/homebrew-tap) on the version just published.
      # Without the token the step is skipped and the cask is bumped by hand; the cask is
      # marked auto_updates, so an older cask still installs and Sparkle updates it.
      - name: Update the Homebrew cask
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA=$(shasum -a 256 "artifacts/WindowHop-$VERSION.dmg" | cut -d' ' -f1)
          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/martonpaulo/homebrew-tap.git" "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          perl -pi -e "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/windowhop.rb
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: WindowHop $VERSION"
          git push origin HEAD

      # The appcast commit is pushed with GITHUB_TOKEN, which starts no workflow,
      # and the release commit's own deploy ran before the release existed. Publish
      # the site now: the download links resolve and the notes page exists.
      - name: Publish the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main -R "$GITHUB_REPOSITORY"

      - name: Remove notary API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/notary"
