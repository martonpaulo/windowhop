name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build (release)
        run: swift build -c release
      - name: Tests
        run: swift test
      - name: Repository validation
        run: scripts/validate.sh
