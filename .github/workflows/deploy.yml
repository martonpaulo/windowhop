name: Deploy

on:
  # Deploy never revalidates: it waits for Validate to pass on main and publishes
  # the exact commit Validate checked (fleet convention, skill-deck #263).
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  # Weekly, so the download count baked into the page (scripts/render-download-count.sh)
  # stays within a week of GitHub's numbers even when the site does not change.
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Publishing is skipped when the published input (site/ plus this workflow) is
  # identical to the last *successful* Pages deployment. Comparing against that,
  # not the previous push, means a site change whose deploy failed or was
  # cancelled still publishes on the next push. Every doubt publishes. The weekly
  # schedule always publishes, since its point is a fresh download count.
  scope:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
      actions: read
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Compare with the last successful deployment
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          publish() { echo "publish=$1" >> "$GITHUB_OUTPUT"; echo "publish=$1: $2"; exit 0; }

          # A schedule has no Validate run of its own, so it republishes the newest
          # main commit that Validate passed, never an unchecked HEAD.
          if [ "$EVENT" = schedule ]; then
            VALIDATED=$(gh api "repos/$REPO/actions/workflows/validate.yml/runs?branch=main&event=push&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // empty') || VALIDATED=""
            [ -n "$VALIDATED" ] || { echo "::error::no successful Validate run on main to republish"; exit 1; }
            echo "sha=$VALIDATED" >> "$GITHUB_OUTPUT"
            publish true "weekly download-count refresh of $VALIDATED"
          fi
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

          # Manual dispatch is the explicit recovery path: always publish.
          [ "$EVENT" = workflow_dispatch ] && publish true "manual dispatch"

          # A version bump is pushed before release.yml builds the DMG, and the pages
          # link WindowHop-<version>.dmg. Wait for that file: release.yml dispatches
          # this workflow once the release is published. Skipping (not cancelling)
          # keeps the run green.
          VERSION=$(git show "$HEAD_SHA:Support/Info.plist" \
            | sed -n '/CFBundleShortVersionString/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}')
          DMG="https://github.com/$REPO/releases/download/v$VERSION/WindowHop-$VERSION.dmg"
          curl -sfIL -o /dev/null "$DMG" \
            || publish false "WindowHop-$VERSION.dmg is not published yet; release.yml deploys after the release"

          # Newest first. Superseded deployments later turn `inactive`, so look
          # for any `success` status rather than the latest one; failed and
          # cancelled deployments never reach `success`.
          deployments=$(gh api "repos/$REPO/deployments?environment=github-pages&per_page=30" \
            --jq '.[] | "\(.id) \(.sha)"') || publish true "deployments API error"
          LAST=""
          while read -r id sha; do
            [ -n "$id" ] || continue
            ok=$(gh api "repos/$REPO/deployments/$id/statuses?per_page=100" \
              --jq 'any(.[]; .state == "success")') || publish true "statuses API error"
            if [ "$ok" = true ]; then LAST=$sha; break; fi
          done <<< "$deployments"

          [ -n "$LAST" ] || publish true "no successful deployment found"
          git cat-file -e "$LAST^{commit}" 2>/dev/null || publish true "last deployed $LAST not fetchable"

          echo "last deployed: $LAST"
          echo "candidate:     $HEAD_SHA"
          CHANGED=$(git diff --name-only "$LAST" "$HEAD_SHA" -- site .github/workflows/deploy.yml CHANGELOG.md scripts/render-release-notes.py scripts/render-download-count.sh) \
            || publish true "diff failed"
          echo "changed published input:"; echo "${CHANGED:-(none)}"
          if [ -n "$CHANGED" ]; then publish true "site changed"; else publish false "site unchanged"; fi

  build:
    needs: scope
    if: needs.scope.outputs.publish == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.scope.outputs.sha }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # The count and the release notes are written into a staged copy, never into
      # site/ itself. The count script exits 0 without it when GitHub's API is
      # unavailable; the notes come from CHANGELOG.md, one page per release (#128).
      - name: Stage the site with the download count and release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp -R site "$RUNNER_TEMP/site"
          scripts/render-download-count.sh "$RUNNER_TEMP/site"
          python3 scripts/render-release-notes.py "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
