name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The Xcode pin: one version on one runner image, so a build means the same thing on every
# run. The cache key carries it, so an Xcode upgrade never restores another compiler's
# products. Change XCODE_VERSION and DEVELOPER_DIR together, here and in release.yml.
env:
  XCODE_VERSION: "26.6"
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  # The SwiftLint pin: a release binary with a verified checksum, so CI lints with the same
  # version as a local `brew install swiftlint` of that release. swift-format comes from the
  # pinned Xcode above.
  SWIFTLINT_VERSION: "0.65.1"
  SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0

jobs:
  # Repository invariants cover markdown, the site and screenshots too, so this
  # runs for every change. It is seconds of shell.
  validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Repository validation
        run: make validate

  # A release build plus the full suite costs minutes of macOS runner time, so
  # it only runs when something it could actually observe changed. Documentation
  # and website commits are covered by `validate` alone.
  scope:
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.check.outputs.swift }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect Swift-relevant changes
        id: check
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A first push to a branch, a force push, or an unresolvable base
          # reports the null SHA: build rather than guess.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}")
          echo "changed files:"; echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(Sources/|Tests/|Support/|scripts/|Makefile|Package\.swift|Package\.resolved|\.swift-format|\.swiftlint\.yml|\.github/workflows/validate\.yml)'; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
          else
            echo "swift=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    needs: scope
    if: needs.scope.outputs.swift == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Confirm the pinned Xcode
        run: |
          xcodebuild -version
          xcodebuild -version | grep -qx "Xcode $XCODE_VERSION"
      # Sparkle's clone and binary download dominate a cold build. No restore-keys: a
      # partial hit would bring products from another Xcode or another dependency set.
      - name: Restore the SwiftPM build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-${{ env.XCODE_VERSION }}-${{ hashFiles('Package.resolved') }}
      - name: Install the pinned SwiftLint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          echo "$SWIFTLINT_SHA256  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/swiftlint"
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
      - name: Report the lint tool versions
        run: |
          swiftlint version
          swiftlint version | grep -qx "$SWIFTLINT_VERSION"
          swift format --version
      # build, lint (SwiftLint and swift-format, warnings as errors), test, validate and
      # strings-check, stopping at the first failure. The catalog's keys come from a
      # compiler build, so strings-check lives here and not in the `validate` job (#99).
      - name: Check (release build, lint, tests, invariants, String Catalog)
        run: make check CONFIGURATION=release
