name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The Xcode pin: one version on one runner image, so a build means the same thing on every
# run. The cache key carries it, so an Xcode upgrade never restores another compiler's
# products. Change XCODE_VERSION and DEVELOPER_DIR together, here and in release.yml.
env:
  XCODE_VERSION: "26.6"
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  # Repository invariants cover markdown, the site and screenshots too, so this
  # runs for every change. It is seconds of shell.
  validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Repository validation
        run: make validate

  # A release build plus the full suite costs minutes of macOS runner time, so
  # it only runs when something it could actually observe changed. Documentation
  # and website commits are covered by `validate` alone.
  scope:
    runs-on: ubuntu-latest
    outputs:
      swift: ${{ steps.check.outputs.swift }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect Swift-relevant changes
        id: check
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A first push to a branch, a force push, or an unresolvable base
          # reports the null SHA: build rather than guess.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}")
          echo "changed files:"; echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(Sources/|Tests/|Support/|scripts/|Package\.swift|Package\.resolved|\.github/workflows/validate\.yml)'; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
          else
            echo "swift=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    needs: scope
    if: needs.scope.outputs.swift == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Confirm the pinned Xcode
        run: |
          xcodebuild -version
          xcodebuild -version | grep -qx "Xcode $XCODE_VERSION"
      # Sparkle's clone and binary download dominate a cold build. No restore-keys: a
      # partial hit would bring products from another Xcode or another dependency set.
      - name: Restore the SwiftPM build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-${{ env.XCODE_VERSION }}-${{ hashFiles('Package.resolved') }}
      - name: Build (release)
        run: make build CONFIGURATION=release
      - name: Tests
        run: make test
      # The catalog's keys come from a compiler build, so this check lives here and
      # not in `validate` (#99).
      - name: String Catalog matches the sources
        run: make strings-check
