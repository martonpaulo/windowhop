# Fleet Dependabot configuration, from skill-deck's project-setup template
# (assets/dependabot.template.yml). Majors are ignored and reviewed by hand; the cooldown
# keeps a day-old release out of a pull request. Swift packages have no production or
# development split, so the one group matches every package by name.
version: 2
updates:
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Madrid
    cooldown:
      default-days: 3
      semver-major-days: 30
      semver-minor-days: 3
      semver-patch-days: 3
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      swift-packages:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: Europe/Madrid
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
